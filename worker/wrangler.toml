name = "asly-veo"
main = "veo-proxy.js"
compatibility_date = "2026-11-20"

[[kv_namespaces]]
binding = "VEO_KV"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
DAILY_VEO_CAP = "5"
PER_DEVICE_VEO_CAP = "1"
VEO_ENABLED = "true"
# GEMINI_API_KEY يُضاف كـ secret وليس هنا أبداً:
#   npx wrangler secret put GEMINI_API_KEY
