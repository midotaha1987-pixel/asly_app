# بناء نسخة APK (debug) لتطبيق «علم ينتفع به» — يعمل على GitHub
# الناتج: ملف ilm-yantaf3-bihi-v2.0.0.apk جاهز للتثبيت على أندرويد مباشرة،
# ويُرفع كأصل (asset) في الإصدار apk-v2.0.0 — رابطه ثابت ويستخدمه
# زر «نزّل نسخة الأندرويد» في الصفحة الرئيسية للتطبيق:
# https://github.com/midotaha1987-pixel/asly_app/releases/download/apk-v2.0.0/ilm-yantaf3-bihi-v2.0.0.apk
#
# ⚠️ اسم الوسم (tag) مقيّد بقاعدة مستودع: إنشاء وسم v2.0.0-android مرفوض
# («Cannot create ref due to creations being restricted») — لذلك الوسم
# apk-v2.0.0، وهو موجود بالفعل. خطوة الحذف أدناه تحذف الإصدار فقط
# (بدون --cleanup-tag) حتى يبقى الوسم، فخطوة النشر تحدّث الإصدار عليه
# ولا تحتاج إنشاء وسم جديد أبداً.
#
# متى يعمل:
# - يدوياً من تبويب Actions (workflow_dispatch) — الطريقة المعتادة بعد أي
#   تعديل على صفحات التطبيق (ملفات الويب تُنسخ في www/ أثناء البناء).
# - تلقائياً عند دفع تعديل يمسّ ملفات أندرويد/Capacitor نفسها فقط — تعديلات
#   الويب وحدها لا تعيد البناء (شغّلها يدوياً عند الحاجة).
# نسخة debug لا تحتاج مفتاح توقيع، وتصلح للتوزيع الداخلي فقط.
# نسخة release الموقّعة (Google Play) تحتاج keystore + أسرار GitHub — تُضاف لاحقاً.
name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "android/**"
      - "native-ads-entry.js"
      - "vendor/**"
      - "scripts/sync-www.js"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Publish step needs the apk-v2.0.0 tag visible locally
          # (default shallow checkout fetches no tags).
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets + native ads bundle
        run: npm run sync

      # Capacitor 8's android library targets Java 21 — JDK 17 fails its
      # compile with "invalid source release: 21".
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # GitHub-hosted runners already ship the full Android SDK (root-owned at
      # /usr/local/lib/android/sdk). android-actions/setup-android@v3 fails on
      # it (permission errors reinstalling over the preinstalled SDK), so use
      # the preinstalled one directly instead.
      - name: Use runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-android-apk.log"
          test "${PIPESTATUS[0]}" -eq 0

      # Keep the Gradle log when the build fails — the job log download
      # needs repo auth, this artifact does not.
      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-android-apk-log
          path: gradle-android-apk.log
          if-no-files-found: warn

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ilm-yantaf3-bihi-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ilm-yantaf3-bihi-apk
          path: ilm-yantaf3-bihi-v2.0.0.apk
          if-no-files-found: error

      # The release created by run 1 (gh CLI) came out immutable/published
      # with no assets, and GitHub refuses asset uploads to it — so remove
      # it first; the step below recreates it fresh with the APK attached.
      # (Tolerates absence on the very first run.)
      # NOTE: no --cleanup-tag here on purpose — the repo ruleset forbids
      # creating the tag v2.0.0-android, and the replacement tag apk-v2.0.0
      # already exists; deleting it would leave the publish step unable to
      # recreate it (that is exactly how the download link died on 2026-11-25).
      - name: Remove previous release (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-v2.0.0 --yes || true

      # Stable download URL for the home-screen button:
      # .../releases/download/apk-v2.0.0/ilm-yantaf3-bihi-v2.0.0.apk
      # (the tag apk-v2.0.0 already exists, so no tag creation is needed)
      # NOTE: gh release create AND softprops both failed here with a bare
      # "HTTP 422: Validation Failed" (runs 45545054876, 45545536616,
      # 45546393572) hiding the API's errors array — so publish goes through
      # the REST API with curl, whose raw response shows the exact cause.
      - name: Publish to release apk-v2.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          {
          python3 - <<'PYEOF' > /tmp/release_payload.json
          import json
          print(json.dumps({
            "tag_name": "apk-v2.0.0",
            "target_commitish": "main",
            "name": "Android v2.0.0 (APK)",
            "body": "نسخة أندرويد (debug) من «علم ينتفع به» — تثبيت مباشر من خارج المتجر. الإعلانات الحقيقية (AdMob) تعمل داخل هذه النسخة.",
            "draft": False,
            "prerelease": False,
          }, ensure_ascii=False))
          PYEOF
          for i in 1 2 3 4 5; do
            REL_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases/tags/apk-v2.0.0")
            REL_ID=$(echo "$REL_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id') or '')" 2>/dev/null)
            if [ -n "$REL_ID" ]; then
              echo "release $REL_ID exists — uploading asset"
              UPLOAD_URL=$(echo "$REL_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
              UPLOAD_OUT=$(curl -s -w "\nUPLOAD_HTTP:%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @ilm-yantaf3-bihi-v2.0.0.apk "$UPLOAD_URL?name=ilm-yantaf3-bihi-v2.0.0.apk" | tail -5)
              echo "$UPLOAD_OUT"
              echo "$UPLOAD_OUT" | grep -q "UPLOAD_HTTP:2" && break
              echo "upload failed — retrying in 20s"
              sleep 20
              continue
            fi
            echo "no release — creating (attempt $i)"
            CREATE_RESP=$(curl -s -w "\nCREATE_HTTP:%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases" --data @/tmp/release_payload.json)
            echo "$CREATE_RESP" | tail -15
            sleep 20
          done
          # Final check: the release must exist AND carry the APK asset.
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases/tags/apk-v2.0.0" | python3 -c "import json,sys; d=json.load(sys.stdin); a=d.get('assets',[]); print('ASSETS:', [(x['name'], x['size']) for x in a]); sys.exit(0 if any(x['name']=='ilm-yantaf3-bihi-v2.0.0.apk' for x in a) else 1)"
          } 2>&1 | tee "$GITHUB_WORKSPACE/publish.log"
          test "${PIPESTATUS[0]}" -eq 0

      # Job logs need repo auth to read; surface the publish log as a
      # job annotation instead (readable without auth).
      - name: Annotate publish log on failure
        if: failure()
        run: |
          MSG=$(tail -60 "$GITHUB_WORKSPACE/publish.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{print $0 "%0A"}' | tr -d '\n')
          echo "::error title=APK publish log::$MSG"
