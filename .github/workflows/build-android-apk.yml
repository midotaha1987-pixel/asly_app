# بناء نسخة APK (debug) لتطبيق «علم ينتفع به» — يعمل على GitHub
# الناتج: ملف ilm-yantaf3-bihi-v2.0.0.apk جاهز للتثبيت على أندرويد مباشرة،
# ويُرفع كأصل (asset) في الإصدار apk-v2.0.2 — رابطه ثابت ويستخدمه
# زر «نزّل نسخة الأندرويد» في الصفحة الرئيسية للتطبيق:
# https://github.com/midotaha1987-pixel/asly_app/releases/download/apk-v2.0.2/ilm-yantaf3-bihi-v2.0.0.apk
#
# ⚠️ قاعدة ذهبية — لا تحذف الإصدار أبداً: وسم apk-v2.0.0 احترق نهائياً
# في 2026-11-25 (حذفنا إصداره فرفضت GitHub إعادة استخدامه:
# 422 «tag_name was used by an immutable release»). وسم apk-v2.0.1
# احترق بالطريقة نفسها (أُنشئ إصداره منشوراً فصار immutable وفارغاً
# ورفض رفع الأصل). لذلك: الإصدار يُنشأ **مسودة** (draft)، يُرفع الأصل
# إليها، ثم تُنشر — والنشر لا يحذف الإصدار أبداً بل يحدّث أصله في مكانه.
# لو احتجنا إصداراً جديداً تماماً نستخدم وسماً جديداً (apk-v2.0.3…)
# ونحدّث زر التحميل.
# ⚠️ إنشاء وسم v2.0.0-android مرفوض بقاعدة المستودع
# («Cannot create ref due to creations being restricted») — الوسوم
# تُنشأ بالدفع المباشر من SSH فقط، لا من الـ workflow.
#
# متى يعمل:
# - يدوياً من تبويب Actions (workflow_dispatch) — الطريقة المعتادة بعد أي
#   تعديل على صفحات التطبيق (ملفات الويب تُنسخ في www/ أثناء البناء).
# - تلقائياً عند دفع تعديل يمسّ ملفات أندرويد/Capacitor نفسها فقط — تعديلات
#   الويب وحدها لا تعيد البناء (شغّلها يدوياً عند الحاجة).
# نسخة debug لا تحتاج مفتاح توقيع، وتصلح للتوزيع الداخلي فقط.
# نسخة release الموقّعة (Google Play) تحتاج keystore + أسرار GitHub — تُضاف لاحقاً.
name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "android/**"
      - "native-ads-entry.js"
      - "vendor/**"
      - "scripts/sync-www.js"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Publish step needs the apk-v2.0.2 tag visible locally
          # (default shallow checkout fetches no tags).
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets + native ads bundle
        run: npm run sync

      # Capacitor 8's android library targets Java 21 — JDK 17 fails its
      # compile with "invalid source release: 21".
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # GitHub-hosted runners already ship the full Android SDK (root-owned at
      # /usr/local/lib/android/sdk). android-actions/setup-android@v3 fails on
      # it (permission errors reinstalling over the preinstalled SDK), so use
      # the preinstalled one directly instead.
      - name: Use runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-android-apk.log"
          test "${PIPESTATUS[0]}" -eq 0

      # Keep the Gradle log when the build fails — the job log download
      # needs repo auth, this artifact does not.
      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-android-apk-log
          path: gradle-android-apk.log
          if-no-files-found: warn

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ilm-yantaf3-bihi-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ilm-yantaf3-bihi-apk
          path: ilm-yantaf3-bihi-v2.0.0.apk
          if-no-files-found: error

      # Stable download URL for the home-screen button:
      # .../releases/download/apk-v2.0.2/ilm-yantaf3-bihi-v2.0.0.apk
      # (the tag apk-v2.0.2 is created by direct SSH push; the workflow
      # never deletes the release — see the header note about immutable tags)
      # NOTE: gh release create AND softprops both failed on the old tag
      # with a bare "HTTP 422: Validation Failed" — the raw API error was
      # «tag_name was used by an immutable release» — so publish goes
      # through the REST API with curl, whose raw response shows the cause.
      - name: Publish to release apk-v2.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          {
          python3 - <<'PYEOF' > /tmp/release_payload.json
          import json
          print(json.dumps({
            "tag_name": "apk-v2.0.2",
            "target_commitish": "main",
            "name": "Android v2.0.0 (APK)",
            "body": "نسخة أندرويد (debug) من «علم ينتفع به» — تثبيت مباشر من خارج المتجر. الإعلانات الحقيقية (AdMob) تعمل داخل هذه النسخة.",
            "draft": True,
            "prerelease": False,
          }, ensure_ascii=False))
          PYEOF
          # 1) Create (or reuse) the DRAFT release. NOTE: GET /releases/tags/{tag}
          # cannot see draft releases at all — so the release id and upload_url
          # MUST come from the create response, never from a re-GET by tag.
          CREATE_HTTP=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases" --data @/tmp/release_payload.json)
          echo "CREATE_HTTP:$CREATE_HTTP"
          tail -c 600 /tmp/create.json; echo
          REL_ID=$(python3 -c "import json; print(json.load(open('/tmp/create.json')).get('id') or '')" 2>/dev/null)
          UPLOAD_URL=$(python3 -c "import json; print(json.load(open('/tmp/create.json')).get('upload_url','').split('{')[0])" 2>/dev/null)
          if [ -z "$REL_ID" ]; then
            echo "create returned no id (release may already exist published) — falling back to GET by tag"
            REL_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases/tags/apk-v2.0.2")
            REL_ID=$(echo "$REL_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id') or '')" 2>/dev/null)
            UPLOAD_URL=$(echo "$REL_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('upload_url','').split('{')[0])" 2>/dev/null)
          fi
          if [ -z "$REL_ID" ] || [ -z "$UPLOAD_URL" ]; then echo "ERROR: no release id/upload url"; exit 1; fi
          echo "release id: $REL_ID"
          # 2) Upload the APK (retry; delete a stale same-name asset first).
          for i in 1 2 3; do
            REL_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases/$REL_ID")
            ASSET_ID=$(echo "$REL_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((str(a['id']) for a in d.get('assets',[]) if a['name']=='ilm-yantaf3-bihi-v2.0.0.apk'), ''))" 2>/dev/null)
            if [ -n "$ASSET_ID" ]; then
              echo "deleting stale asset $ASSET_ID first"
              curl -s -o /dev/null -w "DELETE_ASSET_HTTP:%{http_code}\n" -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases/assets/$ASSET_ID"
            fi
            UPLOAD_HTTP=$(curl -s -o /tmp/upload.json -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @ilm-yantaf3-bihi-v2.0.0.apk "$UPLOAD_URL?name=ilm-yantaf3-bihi-v2.0.0.apk")
            echo "UPLOAD_HTTP:$UPLOAD_HTTP (attempt $i)"
            tail -c 300 /tmp/upload.json; echo
            echo "$UPLOAD_HTTP" | grep -q "^2" && break
            echo "upload failed — retrying in 20s"
            sleep 20
          done
          echo "$UPLOAD_HTTP" | grep -q "^2" || { echo "ERROR: upload failed after 3 attempts"; exit 1; }
          # 3) Publish the draft (immutable releases lock only once published).
          PATCH_HTTP=$(curl -s -o /tmp/patch.json -w "%{http_code}" -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases/$REL_ID" -d '{"draft": false}')
          echo "PATCH_HTTP:$PATCH_HTTP"
          tail -c 400 /tmp/patch.json; echo
          # 4) Final check: the (now published) release must exist AND carry the APK asset.
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/midotaha1987-pixel/asly_app/releases/tags/apk-v2.0.2" | python3 -c "import json,sys; d=json.load(sys.stdin); a=d.get('assets',[]); print('ASSETS:', [(x['name'], x['size']) for x in a]); sys.exit(0 if any(x['name']=='ilm-yantaf3-bihi-v2.0.0.apk' for x in a) else 1)"
          } 2>&1 | tee "$GITHUB_WORKSPACE/publish.log"
          test "${PIPESTATUS[0]}" -eq 0

      # Job logs need repo auth to read; surface the publish log as a
      # job annotation instead (readable without auth).
      - name: Annotate publish log on failure
        if: failure()
        run: |
          MSG=$(tail -60 "$GITHUB_WORKSPACE/publish.log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{print $0 "%0A"}' | tr -d '\n')
          echo "::error title=APK publish log::$MSG"
